name: Build (Windows + macOS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (örn: v1.0). Boş bırakılırsa release oluşturulmaz.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: python -m pip install pyinstaller==6.22.2 reportlab==5.0.0 pillow==12.3.0

      - name: İkon üret (multi-size ico)
        run: python build_icon.py

      - name: Exe derle
        run: pyinstaller CV-Olusturucu.spec --noconfirm

      - name: Exe'yi yükle
        uses: actions/upload-artifact@v7
        with:
          name: CV-Olusturucu-Windows
          path: dist/CV-Olusturucu.exe

  macos-x64:
    name: macOS (Intel x64)
    runs-on: macos-13
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: python -m pip install pyinstaller==6.22.2 reportlab==5.0.0 pillow==12.3.0

      - name: İkon üret
        run: python build_icon.py

      - name: .app derle (Intel)
        run: pyinstaller CV-Olusturucu-mac.spec --noconfirm

      - name: Intel app'ini yükle
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          path: dist/CV-Olusturucu.app
          if-no-files-found: error

  macos-arm64:
    name: macOS (Apple Silicon arm64)
    runs-on: macos-14
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: python -m pip install pyinstaller==6.22.2 reportlab==5.0.0 pillow==12.3.0

      - name: İkon üret
        run: python build_icon.py

      - name: .app derle (Apple Silicon)
        run: pyinstaller CV-Olusturucu-mac.spec --noconfirm

      - name: arm64 app'ini yükle
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/CV-Olusturucu.app
          if-no-files-found: error

  macos-universal:
    name: macOS Universal2 app + dmg
    runs-on: macos-14
    needs: [macos-x64, macos-arm64]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: build/apps

      - name: Universal app + dmg oluştur
        run: |
          python build_universal.py \
            "build/apps/macos-arm64/CV-Olusturucu.app" \
            "build/apps/macos-x64/CV-Olusturucu.app" \
            "dist/CV-Olusturucu.app" \
            "dist/CV-Olusturucu.dmg"

      - name: macOS ürünlerini yükle
        uses: actions/upload-artifact@v7
        with:
          name: CV-Olusturucu-macOS
          path: |
            dist/CV-Olusturucu.app
            dist/CV-Olusturucu.dmg

  release:
    name: GitHub Release oluştur
    # Tag push'unda VEYA manuel çalıştırmada release_tag doluysa çalışır
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [windows, macos-universal]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Tag belirle
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
          fi
          echo "Kullanılacak tag: $TAG"

      - name: İndirilenleri listele
        run: find dist -type f

      - name: Release'e yükle (exe + dmg)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            "dist/CV-Olusturucu-Windows/CV-Olusturucu.exe"
            "dist/CV-Olusturucu-macOS/CV-Olusturucu.dmg"
          )
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "DİKKAT - dosya bulunamadı: $f"
              exit 1
            fi
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "Mevcut release'e dosyalar eklendi: $TAG"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "CV Oluşturucu $TAG" --generate-notes
            echo "Yeni release oluşturuldu: $TAG"
          fi