name: Build (Windows + macOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows exe
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: python -m pip install pyinstaller==6.22.2 reportlab==5.0.0 pillow==12.3.0

      - name: İkon üret (multi-size ico)
        run: python build_icon.py

      - name: Exe derle
        run: pyinstaller CV-Olusturucu.spec --noconfirm

      - name: Exe'yi yükle
        uses: actions/upload-artifact@v7
        with:
          name: CV-Olusturucu-Windows
          path: dist/CV-Olusturucu.exe

  macos:
    name: macOS app + dmg
    runs-on: macos-14
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: python -m pip install pyinstaller==6.22.2 reportlab==5.0.0 pillow==12.3.0

      - name: İkon üret (icns dahil)
        run: python build_icon.py

      - name: .app + .dmg üret
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh

      - name: macOS ürünlerini yükle
        uses: actions/upload-artifact@v7
        with:
          name: CV-Olusturucu-macOS
          path: |
            dist/CV-Olusturucu.app
            dist/CV-Olusturucu.dmg

  release:
    name: GitHub Release oluştur
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: İndirilenleri listele
        run: find dist -type f

      - name: Release'e yükle (exe + dmg)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          FILES=(
            "dist/CV-Olusturucu-Windows/CV-Olusturucu.exe"
            "dist/CV-Olusturucu-macOS/CV-Olusturucu.dmg"
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            echo "Mevcut release'e dosyalar eklendi: $TAG"
          else
            gh release create "$TAG" "${FILES[@]}" \
              --title "CV Oluşturucu $TAG" --generate-notes
            echo "Yeni release oluşturuldu: $TAG"
          fi